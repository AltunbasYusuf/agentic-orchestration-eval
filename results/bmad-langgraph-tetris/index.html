<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tetris</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="game-container">
  <div class="board-wrap">
    <canvas id="board" width="300" height="600"></canvas>
    <div id="game-over-overlay" class="overlay hidden">
      <div class="overlay-content">
        <h2>Game Over</h2>
        <p>Final Score: <span id="final-score">0</span></p>
        <button id="restart-btn">Restart</button>
      </div>
    </div>
    <div id="paused-overlay" class="overlay hidden">
      <div class="overlay-content">
        <h2>PAUSED</h2>
      </div>
    </div>
  </div>
  <div class="hud">
    <h1>Tetris</h1>
    <div class="stat">
      <span class="label">Score</span>
      <span id="score" class="value">0</span>
    </div>
    <div class="stat">
      <span class="label">Level</span>
      <span id="level" class="value">0</span>
    </div>
    <div class="stat">
      <span class="label">Lines</span>
      <span id="lines" class="value">0</span>
    </div>
    <div class="controls">
      <p><strong>&larr; &rarr;</strong> move</p>
      <p><strong>&darr;</strong> soft drop</p>
      <p><strong>&uarr;</strong> rotate</p>
      <p><strong>Space</strong> hard drop</p>
    </div>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
