[project]
name = "bmad-langgraph"
version = "0.1.0"
description = "BMAD-METHOD ported to LangGraph: the analyst/PM/architect/UX/dev persona pipeline as a stateful, resumable, gated multi-agent graph."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=0.6.0",
  "langgraph-checkpoint-sqlite>=2.0.0",
  "langchain>=0.3.0",
  "langchain-anthropic>=0.3.0",
  "langchain-google-genai>=2.0.0",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "rich>=13.7",
  "python-dotenv>=1.0",
]

[project.scripts]
bmad-langgraph = "bmad_langgraph.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bmad_langgraph"]
